name: Test and Docker build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WEB_Labs_variant_5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WEB_Labs_variant_5/package-lock.json
      - name: Verify PHP extensions
        run: php -r 'foreach(["pdo_sqlite","openssl"] as $e) if(!extension_loaded($e)) exit(1);'
      - run: npm ci
      - name: PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Build Docker and deploy temporary test stack
        run: |
          docker compose build
          docker compose up -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 'http://127.0.0.1:8087/api.php?resource=health'
      - name: Stack logs and cleanup
        if: always()
        run: |
          docker compose logs --tail=50
          docker compose down
